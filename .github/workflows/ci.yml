name: macOS CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Minimum deployment target is macOS 26.0 (Swift 6.2 tools)
    runs-on: macos-15 # Update to macos-26 or macos-latest with macOS 26 SDK when provisioned by GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Swift Version & Environment
        run: |
          swift --version
          xcodebuild -version
          uname -a

      - name: Build All Targets
        run: |
          SDK_VERSION=$(xcrun --show-sdk-version --sdk macosx | cut -d. -f1)
          echo "Detected macOS SDK major version: $SDK_VERSION"
          if [ "$SDK_VERSION" -ge 26 ]; then
            swift build -v
          else
            echo "::warning::GitHub Actions hosted runner is running macOS SDK $SDK_VERSION (< 26.0). Building portable deterministic core targets."
            swift build --target MacDubCore -v
          fi

      - name: Run Deterministic Test Suite (Non-Parallel)
        run: |
          SDK_VERSION=$(xcrun --show-sdk-version --sdk macosx | cut -d. -f1)
          if [ "$SDK_VERSION" -ge 26 ]; then
            swift test --no-parallel -v
          else
            echo "::warning::Running deterministic MacDubCore test suites on SDK $SDK_VERSION."
            swift test --filter MacDubCoreTests --no-parallel -v
          fi
