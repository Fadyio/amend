name: macOS CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Minimum deployment target is macOS 26.0 (Swift 6.2 tools)
    runs-on: macos-15 # Update to macos-26 or macos-latest with macOS 26 SDK when provisioned by GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Swift Version & Environment
        run: |
          swift --version
          xcodebuild -version
          uname -a

      - name: Build All Targets
        run: swift build -v

      - name: Run Deterministic Test Suite (Non-Parallel)
        run: swift test --no-parallel -v
