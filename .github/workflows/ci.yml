name: macOS CI

on:
  push:
    branches: [ main, fix/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test macOS 26+ Native App
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Toolchain & Validate macOS 26+ SDK
        run: |
          echo "=== System Versions ==="
          sw_vers
          xcodebuild -version || true
          swift --version
          xcrun --show-sdk-version --sdk macosx
          xcrun --show-sdk-path --sdk macosx

          SDK_MAJOR=$(xcrun --show-sdk-version --sdk macosx | cut -d. -f1)
          echo "Detected macOS SDK major version: $SDK_MAJOR"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::MacDub requires the macOS 26 SDK or newer (detected SDK $SDK_MAJOR)"
            exit 1
          fi

      - name: Build All Targets
        run: swift build -v

      - name: Run Deterministic Test Suite (Non-Parallel)
        run: swift test --no-parallel -v
